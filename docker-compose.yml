services:
  gateway:
    image: ghcr.io/nikiforidi/api-gateway:${GATEWAY_VERSION}
    expose: ["8000"]
    env_file: .env
    depends_on:
      auth-service: { condition: service_healthy }
      economy-service: { condition: service_healthy }
      crate-digger: { condition: service_healthy }
      marketplace-service: { condition: service_healthy }
      review-service: { condition: service_healthy }
      logistics-service: { condition: service_healthy }
      relay-api: { condition: service_healthy }
      preview-api: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [app-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      gateway: { condition: service_healthy }
      marketplace-frontend: { condition: service_started }
    networks: [app-net]
    restart: unless-stopped

  auth-service:
    image: ghcr.io/nikiforidi/auth-service:${AUTH_VERSION}
    expose: ["8000"]
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [app-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  crate-digger:
    image: ghcr.io/nikiforidi/crate-digger:${CRATE_VERSION}
    expose: ["8000"]
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [app-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  economy-service:
    image: ghcr.io/nikiforidi/economy-service:${ECONOMY_VERSION}
    expose: ["8000"]
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      crate-digger: { condition: service_healthy }
      auth-service: { condition: service_healthy }
    networks: [app-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  marketplace-service:
    image: ghcr.io/nikiforidi/marketplace-service:${MARKETPLACE_VERSION}
    expose: ["8003"]
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      crate-digger: { condition: service_healthy }
      auth-service: { condition: service_healthy }
    networks: [app-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  review-service:
    image: ghcr.io/nikiforidi/review-service:${REVIEW_VERSION}
    expose: ["8000"]
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [app-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  logistics-migrate:
    image: ghcr.io/nikiforidi/logistics-service:${LOGISTICS_VERSION}
    command: alembic upgrade head
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
    networks: [app-net]
    restart: "no"

  logistics-service:
    image: ghcr.io/nikiforidi/logistics-service:${LOGISTICS_VERSION}
    expose: ["8004"]
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      logistics-migrate: { condition: service_completed_successfully }
    networks: [app-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  relay-api:
    image: ghcr.io/nikiforidi/ytb-audio-relay:${RELAY_VERSION}
    expose: ["8000"]
    env_file: .env
    volumes: ["./sessions:/app/sessions"]
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [app-net]
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  relay-worker:
    image: ghcr.io/nikiforidi/ytb-audio-relay:${RELAY_VERSION}
    env_file: .env
    volumes: ["./sessions:/app/sessions"]
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [app-net]
    command: python -m arq worker.WorkerSettings
    restart: unless-stopped
    healthcheck: { disable: true }

  preview-api:
    image: ghcr.io/nikiforidi/ytb-audio-preview:${PREVIEW_VERSION}
    expose: ["8000"]
    env_file: .env
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [app-net]
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  preview-worker:
    image: ghcr.io/nikiforidi/ytb-audio-preview:${PREVIEW_VERSION}
    env_file: .env
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [app-net]
    command: python -m arq worker.WorkerSettings
    restart: unless-stopped
    healthcheck: { disable: true }

  marketplace-frontend:
    image: ghcr.io/nikiforidi/marketplace-frontend:${FRONTEND_VERSION}
    expose: ["3000"]
    env_file: .env
    depends_on:
      gateway: { condition: service_healthy }
    networks: [app-net]
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    env_file: .env
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [app-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  db-init:
    image: postgres:15-alpine
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      PGPASSWORD=$${DB_PASSWORD} psql -h db -U postgres -c 'CREATE DATABASE auth_db;' 2>/dev/null;
      PGPASSWORD=$${DB_PASSWORD} psql -h db -U postgres -c 'CREATE DATABASE economy_db;' 2>/dev/null;
      PGPASSWORD=$${DB_PASSWORD} psql -h db -U postgres -c 'CREATE DATABASE marketplace_db;' 2>/dev/null;
      PGPASSWORD=$${DB_PASSWORD} psql -h db -U postgres -c 'CREATE DATABASE crate_digger;' 2>/dev/null;
      PGPASSWORD=$${DB_PASSWORD} psql -h db -U postgres -c 'CREATE DATABASE review_service;' 2>/dev/null;
      PGPASSWORD=$${DB_PASSWORD} psql -h db -U postgres -c 'CREATE DATABASE logistics_db;' 2>/dev/null;
      exit 0
      "
    networks: [app-net]
    restart: "no"

  redis:
    image: redis:7-alpine
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb
    volumes: ["redis-data:/data"]
    networks: [app-net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    env_file: .env
    command: server /data --console-address ":9001"
    volumes: ["minio-data:/data"]
    networks: [app-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  createbuckets:
    image: minio/mc:latest
    env_file: .env
    restart: "no"
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      /usr/bin/mc mb --ignore-existing myminio/${S3_BUCKET_NAME} &&
      /usr/bin/mc mb --ignore-existing myminio/ytb-audio-previews &&
      /usr/bin/mc mb --ignore-existing myminio/marketplace-listings &&
      /usr/bin/mc mb --ignore-existing myminio/listing-audio &&
      /usr/bin/mc anonymous set public myminio/${S3_BUCKET_NAME} &&
      /usr/bin/mc anonymous set public myminio/ytb-audio-previews &&
      /usr/bin/mc anonymous set public myminio/marketplace-listings &&
      /usr/bin/mc anonymous set public myminio/listing-audio;
      exit 0
      "
    networks: [app-net]

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  app-net:
    driver: bridge