events {
    worker_connections 1024;
}

http {
    upstream api_gateway {
        server gateway:8000;
    }

    upstream minio_backend {
        server minio:9000;
    }

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=minio_limit:10m rate=500r/s;

    # Cache zone for MinIO images
    proxy_cache_path /var/cache/nginx/minio levels=1:2
                     keys_zone=minio_cache:10m
                     max_size=1g
                     inactive=24h
                     use_temp_path=off;

    # ═══════════════════════════════════════════════════
    # HTTP server (порт 80) — только для Let's Encrypt и redirect
    # ═══════════════════════════════════════════════════
    server {
        listen 80;
        server_name stage.waxey.ru;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ═══════════════════════════════════════════════════
    # HTTPS server (порт 443) — основной трафик
    # ═══════════════════════════════════════════════════
    server {
        listen 443 ssl http2;
        server_name stage.waxey.ru;

        # SSL certificates (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/stage.waxey.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/stage.waxey.ru/privkey.pem;
        
        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 20M;

        # ── MinIO проксирование ──────────────────────
        location /minio/ {
            limit_req zone=minio_limit burst=100 nodelay;
            
            proxy_pass http://minio_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Скрываем внутренние заголовки MinIO
            proxy_hide_header x-amz-request-id;
            proxy_hide_header x-amz-id-2;
            proxy_hide_header x-amz-version-id;

            # CORS для изображений
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept" always;

            # Кэширование статики
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Cache-Status $upstream_cache_status always;

            # Кэш
            proxy_cache minio_cache;
            proxy_cache_valid 200 24h;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_key "$scheme$request_method$host$request_uri";

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type "text/plain charset=UTF-8";
                add_header Content-Length 0;
                return 204;
            }
        }

        # ── API Gateway ──────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_read_timeout 120s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ── Frontend (Next.js) ───────────────────────
        location / {
            proxy_pass http://marketplace-frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support (для Next.js HMR в dev)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── Health check ─────────────────────────────
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx","environment":"staging"}';
            add_header Content-Type application/json;
        }

        # ── Favicon и robots.txt ─────────────────────
        location = /favicon.ico {
            access_log off;
            log_not_found off;
            return 204;
        }

        location = /robots.txt {
            access_log off;
            log_not_found off;
            return 200 "User-agent: *\nDisallow: /api/\nDisallow: /minio/\n";
            add_header Content-Type text/plain;
        }
    }
}